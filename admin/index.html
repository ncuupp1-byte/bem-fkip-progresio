<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Dashboard Admin — BEM FKIP</title>
<script src="../assets/data.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1e6b2e;--green-dark:#1a5c27;--green-light:#e8f5eb;--green-pale:#f2faf4;
  --gold:#d4a017;--gold-light:#f5c800;--border:#d8e8da;--white:#fff;
  --text:#1a2e1e;--muted:#6b7c6e;--red:#dc2626;--blue:#3b82f6;
  --sidebar-w:230px;
}
body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:#f0f4f1;color:var(--text);font-size:14px;display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--green-dark);
  display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50;
  overflow-y:auto;
}
.sidebar-brand{padding:18px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-brand img{height:32px;width:32px;object-fit:contain}
.sidebar-brand-text .org{font-size:13px;font-weight:800;color:#fff}
.sidebar-brand-text .kab{font-size:10px;color:var(--gold-light);font-weight:500}
.sidebar-user{padding:12px 16px;background:rgba(0,0,0,.2);margin:8px;border-radius:8px}
.sidebar-user .uname{font-size:12px;font-weight:700;color:#fff}
.sidebar-user .urole{font-size:11px;color:rgba(255,255,255,.55);margin-top:1px}
.sidebar-nav{flex:1;padding:8px 8px}
.nav-section{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.35);padding:10px 8px 4px;margin-top:8px}
.nav-item{
  display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:7px;
  color:rgba(255,255,255,.75);text-decoration:none;font-size:13px;font-weight:500;
  transition:.15s;cursor:pointer;border:none;background:none;width:100%;text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-item.active{background:rgba(255,255,255,.18);color:#fff;font-weight:700}
.nav-item.locked{color:rgba(255,255,255,.3);cursor:not-allowed}
.nav-item.locked:hover{background:none}
.nav-icon{font-size:15px;width:18px;text-align:center}
.sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.1)}
.logout-btn{
  display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;
  background:rgba(220,38,38,.2);color:#fca5a5;border:none;border-radius:7px;
  font-size:13px;font-weight:600;cursor:pointer;transition:.15s;
}
.logout-btn:hover{background:rgba(220,38,38,.35);color:#fff}

/* MAIN */
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:white;border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.topbar-title{font-size:16px;font-weight:700;color:var(--green)}
.topbar-right{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.content{padding:24px;flex:1}

/* CARDS */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:white;border:1px solid var(--border);border-radius:10px;padding:18px}
.stat-card .s-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px}
.stat-card .s-val{font-size:26px;font-weight:900;color:var(--green)}
.stat-card .s-sub{font-size:11px;color:var(--muted);margin-top:4px}

/* PANEL */
.panel{background:white;border:1px solid var(--border);border-radius:10px;margin-bottom:20px}
.panel-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.panel-head h3{font-size:14px;font-weight:700;color:var(--text)}
.panel-body{padding:18px}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl thead th{background:var(--green-light);padding:9px 12px;text-align:left;font-weight:700;color:var(--green-dark);border-bottom:1px solid var(--border)}
.tbl tbody td{padding:9px 12px;border-bottom:1px solid #f0f4f1;vertical-align:middle}
.tbl tbody tr:hover{background:var(--green-pale)}
.tbl tbody tr:last-child td{border-bottom:none}

/* BADGES */
.b{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.b-green{background:#dcfce7;color:#16a34a}
.b-red{background:#fee2e2;color:#dc2626}
.b-blue{background:#dbeafe;color:#1d4ed8}
.b-gold{background:#fef3c7;color:#92400e}
.b-gray{background:#f3f4f6;color:#6b7280}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:.15s;text-decoration:none}
.btn-green{background:var(--green);color:white}.btn-green:hover{background:var(--green-dark)}
.btn-red{background:#fee2e2;color:#dc2626}.btn-red:hover{background:#dc2626;color:white}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--green);color:var(--green)}
.btn-gold{background:var(--gold);color:white}.btn-gold:hover{background:#b8890f}

/* QUICK ACCESS GRID */
.qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.qa-card{
  background:white;border:1px solid var(--border);border-radius:10px;
  padding:18px;text-align:center;cursor:pointer;transition:.15s;text-decoration:none;
  display:block;color:var(--text);
}
.qa-card:hover{box-shadow:0 4px 16px rgba(30,107,46,.12);border-color:var(--green);transform:translateY(-2px)}
.qa-card.locked{opacity:.4;cursor:not-allowed;pointer-events:none}
.qa-card.locked:hover{box-shadow:none;transform:none}
.qa-icon{font-size:28px;margin-bottom:8px}
.qa-label{font-size:13px;font-weight:700}
.qa-desc{font-size:11px;color:var(--muted);margin-top:3px}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%);transition:.3s}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .qa-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <img id="sb-logo1" alt="BEM"/>
    <img id="sb-logo2" alt="Progresio"/>
    <div class="sidebar-brand-text">
      <div class="org">BEM FKIP</div>
      <div class="kab">Kabinet Progresio</div>
    </div>
  </div>
  <div class="sidebar-user">
    <div class="uname" id="sb-name">—</div>
    <div class="urole" id="sb-role">—</div>
  </div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-footer">
    <button class="logout-btn" onclick="BEM.logout()">🚪 Keluar</button>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="pageTitle">Dashboard</div>
    <div class="topbar-right">
      <span id="topbar-user">—</span>
      <a href="../index.html" class="btn btn-outline" style="font-size:11px">← Lihat Website</a>
    </div>
  </div>

  <div class="content" id="mainContent">
    <!-- Diisi oleh JS -->
  </div>
</div>

<script>
// ── INIT ─────────────────────────────────────────────────────────────
const user = BEM.requireAuth('dashboard');
if (!user) throw new Error('Not authenticated');

document.getElementById('sb-logo1').src = LOGO_BEM;
document.getElementById('sb-logo2').src = LOGO_KAB;
document.getElementById('sb-name').textContent = user.name;
document.getElementById('sb-role').textContent = user.label;
document.getElementById('topbar-user').textContent = user.name;

// ── SIDEBAR NAV BUILDER ────────────────────────────────────────────
const NAV_ITEMS = [
  { section: 'Umum' },
  { key: 'dashboard', icon: '🏠', label: 'Dashboard', href: 'index.html' },
  { section: 'Konten' },
  { key: 'berita', icon: '📰', label: 'Berita & Pengumuman', href: 'berita.html' },
  { key: 'kegiatan', icon: '📅', label: 'Kegiatan', href: 'kegiatan.html' },
  { key: 'proker', icon: '📊', label: 'Program Kerja', href: 'kegiatan.html#proker' },
  { section: 'Organisasi' },
  { key: 'pengurus', icon: '👥', label: 'Data Pengurus', href: 'pengurus.html' },
  { key: 'aspirasi', icon: '💬', label: 'Aspirasi Masuk', href: 'aspirasi.html' },
  { key: 'keuangan', icon: '💰', label: 'Keuangan', href: '../organisasi-keuangan/index.html' },
  { section: 'Dokumen' },
  { key: 'notulensi', icon: '📝', label: 'Notulensi', href: 'notulensi.html' },
];

const nav = document.getElementById('sidebarNav');
NAV_ITEMS.forEach(item => {
  if (item.section) {
    const s = document.createElement('div');
    s.className = 'nav-section';
    s.textContent = item.section;
    nav.appendChild(s);
    return;
  }
  const a = document.createElement('a');
  a.href = item.href;
  a.className = 'nav-item' + (item.key === 'dashboard' ? ' active' : '') + (!BEM.canAccess(item.key) ? ' locked' : '');
  a.innerHTML = `<span class="nav-icon">${item.icon}</span>${item.label}${!BEM.canAccess(item.key) ? ' 🔒' : ''}`;
  if (!BEM.canAccess(item.key)) a.onclick = e => e.preventDefault();
  nav.appendChild(a);
});

// ── DASHBOARD CONTENT ─────────────────────────────────────────────
(async function() {
const [berita, kegiatan, proker] = await Promise.all([
  BEM.getData('berita'),
  BEM.getData('kegiatan'),
  BEM.getData('proker')
]);
const aspirasi = JSON.parse(localStorage.getItem('aspirasi_bem') || '[]');

const berjalan = proker.filter(p => p.status === 'berjalan').length;
const selesai  = proker.filter(p => p.status === 'selesai').length;
const aspMasuk = aspirasi.filter(a => a.status === 'Masuk').length;

// Quick Access tiles — filtered by role
const QA_ALL = [
  { key:'berita',   icon:'📰', label:'Kelola Berita',   desc:'Tambah/edit berita & pengumuman', href:'berita.html' },
  { key:'kegiatan', icon:'📅', label:'Kelola Kegiatan', desc:'Input & update kegiatan',         href:'kegiatan.html' },
  { key:'proker',   icon:'📊', label:'Program Kerja',   desc:'Update progress proker',           href:'kegiatan.html#proker' },
  { key:'pengurus', icon:'👥', label:'Data Pengurus',   desc:'Edit profil & susunan pengurus',  href:'pengurus.html' },
  { key:'aspirasi', icon:'💬', label:'Aspirasi Masuk',  desc:aspMasuk + ' aspirasi belum diproses', href:'aspirasi.html' },
  { key:'keuangan', icon:'💰', label:'Keuangan',        desc:'Dashboard laporan keuangan',       href:'../organisasi-keuangan/index.html' },
  { key:'notulensi',icon:'📝', label:'Notulensi',       desc:'Tambah notulensi rapat',           href:'notulensi.html' },
];

document.getElementById('mainContent').innerHTML = `
  <div class="stat-grid">
    <div class="stat-card">
      <div class="s-label">Berita Dipublikasi</div>
      <div class="s-val">${berita.length}</div>
      <div class="s-sub">artikel</div>
    </div>
    <div class="stat-card">
      <div class="s-label">Proker Selesai</div>
      <div class="s-val">${selesai}</div>
      <div class="s-sub">dari ${proker.length} total</div>
    </div>
    <div class="stat-card">
      <div class="s-label">Proker Berjalan</div>
      <div class="s-val" style="color:var(--gold)">${berjalan}</div>
      <div class="s-sub">sedang berlangsung</div>
    </div>
    <div class="stat-card">
      <div class="s-label">Aspirasi Masuk</div>
      <div class="s-val" style="color:${aspMasuk>0?'#dc2626':'var(--green)'}">${aspMasuk}</div>
      <div class="s-sub">belum ditindaklanjuti</div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
    <div class="panel">
      <div class="panel-head">
        <h3>⚡ Akses Cepat</h3>
        <span style="font-size:11px;color:var(--muted)">Sesuai akses Anda</span>
      </div>
      <div class="panel-body">
        <div class="qa-grid">
          ${QA_ALL.map(q => `
            <a href="${q.href}" class="qa-card${BEM.canAccess(q.key)?'':' locked'}">
              <div class="qa-icon">${q.icon}</div>
              <div class="qa-label">${q.label}</div>
              <div class="qa-desc">${q.desc}</div>
            </a>
          `).join('')}
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>📋 Proker Terbaru</h3><a href="kegiatan.html#proker" class="btn btn-outline">Lihat semua</a></div>
      <div class="panel-body" style="padding:0">
        <table class="tbl">
          <thead><tr><th>Proker</th><th>Dept.</th><th>Progress</th></tr></thead>
          <tbody>
            ${proker.slice(0,5).map(p => `
              <tr>
                <td style="font-weight:600">${p.nama}</td>
                <td><span class="b b-gray">${p.dept}</span></td>
                <td>
                  <div style="display:flex;align-items:center;gap:8px">
                    <div style="flex:1;height:6px;background:#e8f5eb;border-radius:3px;overflow:hidden">
                      <div style="height:100%;width:${p.pct}%;background:${p.pct===100?'#16a34a':p.pct>50?'#1e6b2e':'#d4a017'};border-radius:3px"></div>
                    </div>
                    <span style="font-size:11px;font-weight:700;color:var(--green);min-width:30px">${p.pct}%</span>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  </div>

  ${aspMasuk > 0 ? `
  <div class="panel">
    <div class="panel-head">
      <h3>💬 Aspirasi Belum Ditindaklanjuti</h3>
      <a href="aspirasi.html" class="btn btn-green">Kelola Aspirasi</a>
    </div>
    <div class="panel-body" style="padding:0">
      <table class="tbl">
        <thead><tr><th>Pengirim</th><th>Kategori</th><th>Subjek</th><th>Tanggal</th><th>Status</th></tr></thead>
        <tbody>
          ${aspirasi.filter(a=>a.status==='Masuk').slice(0,5).map(a=>`
            <tr>
              <td>${a.nama}</td>
              <td><span class="b b-blue">${a.kategori||'Umum'}</span></td>
              <td>${a.subjek}</td>
              <td style="color:var(--muted)">${a.tanggal}</td>
              <td><span class="b b-gold">Masuk</span></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  </div>` : ''}

  <div style="text-align:center;padding:16px 0;font-size:12px;color:var(--muted)">
    BEM FKIP Kabinet Progresio — Admin Panel &nbsp;·&nbsp; Login sebagai <strong>${user.label}</strong>
  </div>
`;
})();
</script>
</body>
</html>
