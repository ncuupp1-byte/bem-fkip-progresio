<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Kelola Kegiatan — Admin BEM FKIP</title>
<script src="../assets/data.js"></script>
<link rel="stylesheet" href="admin-shared.css"/>
</head>
<body>
<div id="app"></div>
<script src="admin-ui.js"></script>
<script>
const user = BEM.requireAuth('kegiatan');
if (!user) throw '';
initAdminShell(user, 'kegiatan', 'Kelola Kegiatan & Proker');

let kegiatan = [];
let proker   = [];

const deptFilter = (user.dept && user.role === 'departemen') ? user.dept : null;
const DEPTS      = ['Pendidikan','Minat & Bakat','Advokasi','Kominfo','Keagamaan','Jaringan'];
const STATUS_OPTS = ['rencana','berjalan','selesai','batal'];
const STATUS_B    = { rencana:'b-gold', berjalan:'b-blue', selesai:'b-green', batal:'b-red' };

async function loadAll() {
  [kegiatan, proker] = await Promise.all([
    BEM.getData('kegiatan'),
    BEM.getData('proker')
  ]);
  renderPage();
}

function renderPage() {
  const hash = window.location.hash;
  if (hash === '#proker') renderProker();
  else renderKegiatan();
}

// ─── KEGIATAN ────────────────────────────────────────────────────
function renderKegiatan() {
  const list = deptFilter ? kegiatan.filter(k => k.dept === deptFilter) : kegiatan;
  setContent(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px">
      <div>
        <h2 style="font-size:18px;font-weight:800;color:var(--green)">Kegiatan</h2>
        ${deptFilter ? `<div style="font-size:12px;color:var(--muted)">Menampilkan kegiatan Dept. ${deptFilter}</div>` : ''}
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline" onclick="window.location.hash='#proker';renderProker()">Lihat Proker →</button>
        <button class="btn btn-green" onclick="showKegiatanForm()">+ Tambah Kegiatan</button>
      </div>
    </div>

    <div class="panel" id="kFormPanel" style="display:none;margin-bottom:20px">
      <div class="panel-head"><h3 id="kFormTitle">Tambah Kegiatan</h3></div>
      <div class="panel-body">
        <input type="hidden" id="kEditId"/>
        <div class="fg"><label class="fl">Nama Kegiatan *</label><input class="fi" id="k_nama" placeholder="Nama kegiatan..."/></div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
          <div class="fg"><label class="fl">Tanggal</label><input class="fi" type="date" id="k_tgl"/></div>
          <div class="fg"><label class="fl">Tempat</label><input class="fi" id="k_tempat" placeholder="Lokasi..."/></div>
          <div class="fg"><label class="fl">Departemen</label>
            <select class="fi" id="k_dept">
              ${DEPTS.map(d => `<option value="${d}"${deptFilter===d?' selected':''}>${d}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="fg"><label class="fl">Status</label>
          <select class="fi" id="k_status">
            ${STATUS_OPTS.map(s => `<option value="${s}">${s}</option>`).join('')}
          </select>
        </div>
        <div style="display:flex;gap:8px;margin-top:4px">
          <button class="btn btn-green" onclick="saveKegiatan()">💾 Simpan</button>
          <button class="btn btn-outline" onclick="document.getElementById('kFormPanel').style.display='none'">Batal</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Daftar Kegiatan (${list.length})</h3></div>
      <div style="overflow-x:auto">
        <table class="tbl">
          <thead><tr><th>Nama Kegiatan</th><th>Tanggal</th><th>Tempat</th><th>Dept.</th><th>Status</th><th>Aksi</th></tr></thead>
          <tbody>
            ${list.length ? list.map(k => `
              <tr>
                <td style="font-weight:600">${k.icon||'📌'} ${k.nama}</td>
                <td style="color:var(--muted)">${k.tanggal}</td>
                <td style="color:var(--muted)">${k.tempat}</td>
                <td><span class="b b-gray">${k.dept}</span></td>
                <td><span class="b ${STATUS_B[k.status]||'b-gray'}">${k.status}</span></td>
                <td>
                  <button class="btn btn-outline" onclick="editKegiatan(${k.id})" style="margin-right:4px">✏️</button>
                  <button class="btn btn-red" onclick="deleteKegiatan(${k.id})">🗑</button>
                </td>
              </tr>
            `).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:24px">Belum ada kegiatan.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `);
  document.getElementById('k_tgl').value = new Date().toISOString().split('T')[0];
}

function showKegiatanForm() {
  document.getElementById('kFormPanel').style.display = 'block';
  document.getElementById('kEditId').value = '';
  document.getElementById('kFormTitle').textContent = 'Tambah Kegiatan';
  document.getElementById('k_nama').value = '';
  document.getElementById('k_tempat').value = '';
}
function editKegiatan(id) {
  const k = kegiatan.find(x => x.id == id); if (!k) return;
  document.getElementById('kFormPanel').style.display = 'block';
  document.getElementById('kFormTitle').textContent = 'Edit Kegiatan';
  document.getElementById('kEditId').value = id;
  document.getElementById('k_nama').value = k.nama;
  document.getElementById('k_tempat').value = k.tempat;
  document.getElementById('k_dept').value = k.dept;
  document.getElementById('k_status').value = k.status;
}
async function saveKegiatan() {
  const nama = document.getElementById('k_nama').value.trim();
  if (!nama) { alert('Nama kegiatan wajib diisi!'); return; }
  const editId = document.getElementById('kEditId').value;
  const tglRaw = document.getElementById('k_tgl').value;
  const obj = {
    nama,
    tanggal: tglRaw || '—',
    tempat: document.getElementById('k_tempat').value,
    dept:   document.getElementById('k_dept').value,
    status: document.getElementById('k_status').value,
    icon:   '📌'
  };
  const btn = event.target;
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  if (editId) await BEM.updateData('kegiatan', editId, obj);
  else        await BEM.insertData('kegiatan', obj);
  btn.disabled = false; btn.textContent = '💾 Simpan';
  document.getElementById('kFormPanel').style.display = 'none';
  kegiatan = await BEM.getData('kegiatan');
  renderKegiatan();
}
async function deleteKegiatan(id) {
  if (!confirm('Hapus kegiatan ini?')) return;
  await BEM.deleteData('kegiatan', id);
  kegiatan = await BEM.getData('kegiatan');
  renderKegiatan();
}

// ─── PROKER ──────────────────────────────────────────────────────
function renderProker() {
  const list = deptFilter ? proker.filter(p => p.dept === deptFilter) : proker;
  setContent(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px">
      <div>
        <h2 style="font-size:18px;font-weight:800;color:var(--green)">Program Kerja</h2>
        ${deptFilter ? `<div style="font-size:12px;color:var(--muted)">Dept. ${deptFilter}</div>` : ''}
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline" onclick="window.location.hash='';renderKegiatan()">← Kegiatan</button>
        <button class="btn btn-green" onclick="showProkerForm()">+ Tambah Proker</button>
      </div>
    </div>

    <div class="panel" id="pFormPanel" style="display:none;margin-bottom:20px">
      <div class="panel-head"><h3 id="pFormTitle">Tambah Program Kerja</h3></div>
      <div class="panel-body">
        <input type="hidden" id="pEditId"/>
        <div class="fg"><label class="fl">Nama Program Kerja *</label><input class="fi" id="p_nama" placeholder="Nama proker..."/></div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
          <div class="fg"><label class="fl">Departemen</label>
            <select class="fi" id="p_dept">
              ${DEPTS.map(d => `<option value="${d}"${deptFilter===d?' selected':''}>${d}</option>`).join('')}
            </select>
          </div>
          <div class="fg"><label class="fl">Waktu Pelaksanaan</label><input class="fi" id="p_waktu" placeholder="Mar–Apr 2026"/></div>
          <div class="fg"><label class="fl">Status</label>
            <select class="fi" id="p_status">
              <option value="rencana">Rencana</option>
              <option value="berjalan">Berjalan</option>
              <option value="selesai">Selesai</option>
              <option value="batal">Dibatalkan</option>
            </select>
          </div>
        </div>
        <div class="fg">
          <label class="fl">Progress: <span id="pctLabel">0</span>%</label>
          <input type="range" id="p_pct" min="0" max="100" value="0" style="width:100%" oninput="document.getElementById('pctLabel').textContent=this.value"/>
        </div>
        <div style="display:flex;gap:8px;margin-top:4px">
          <button class="btn btn-green" onclick="saveProker()">💾 Simpan</button>
          <button class="btn btn-outline" onclick="document.getElementById('pFormPanel').style.display='none'">Batal</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Daftar Proker (${list.length})</h3></div>
      <div style="overflow-x:auto">
        <table class="tbl">
          <thead><tr><th>Program Kerja</th><th>Dept.</th><th>Waktu</th><th>Status</th><th>Progress</th><th>Aksi</th></tr></thead>
          <tbody>
            ${list.length ? list.map(p => `
              <tr>
                <td style="font-weight:600">${p.nama}</td>
                <td><span class="b b-gray">${p.dept}</span></td>
                <td style="color:var(--muted)">${p.waktu}</td>
                <td><span class="b ${STATUS_B[p.status]||'b-gray'}">${p.status}</span></td>
                <td style="min-width:120px">
                  <div style="display:flex;align-items:center;gap:6px">
                    <div style="flex:1;height:7px;background:#e8f5eb;border-radius:4px;overflow:hidden">
                      <div style="height:100%;width:${p.pct}%;background:${p.pct==100?'#16a34a':'#1e6b2e'};border-radius:4px"></div>
                    </div>
                    <span style="font-size:11px;font-weight:700;color:var(--green)">${p.pct}%</span>
                  </div>
                </td>
                <td>
                  <button class="btn btn-outline" onclick="editProker(${p.id})" style="margin-right:4px">✏️</button>
                  <button class="btn btn-red" onclick="deleteProker(${p.id})">🗑</button>
                </td>
              </tr>
            `).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:24px">Belum ada proker.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `);
}

function showProkerForm() {
  document.getElementById('pFormPanel').style.display = 'block';
  document.getElementById('pEditId').value = '';
  document.getElementById('pFormTitle').textContent = 'Tambah Program Kerja';
  document.getElementById('p_nama').value = '';
  document.getElementById('p_pct').value = 0;
  document.getElementById('pctLabel').textContent = '0';
}
function editProker(id) {
  const p = proker.find(x => x.id == id); if (!p) return;
  document.getElementById('pFormPanel').style.display = 'block';
  document.getElementById('pFormTitle').textContent = 'Edit Proker';
  document.getElementById('pEditId').value = id;
  document.getElementById('p_nama').value = p.nama;
  document.getElementById('p_waktu').value = p.waktu;
  document.getElementById('p_dept').value = p.dept;
  document.getElementById('p_status').value = p.status;
  document.getElementById('p_pct').value = p.pct;
  document.getElementById('pctLabel').textContent = p.pct;
}
async function saveProker() {
  const nama = document.getElementById('p_nama').value.trim();
  if (!nama) { alert('Nama proker wajib diisi!'); return; }
  const editId = document.getElementById('pEditId').value;
  const obj = {
    nama,
    dept:   document.getElementById('p_dept').value,
    waktu:  document.getElementById('p_waktu').value,
    status: document.getElementById('p_status').value,
    pct:    parseInt(document.getElementById('p_pct').value)
  };
  const btn = event.target;
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  if (editId) await BEM.updateData('proker', editId, obj);
  else        await BEM.insertData('proker', obj);
  btn.disabled = false; btn.textContent = '💾 Simpan';
  document.getElementById('pFormPanel').style.display = 'none';
  proker = await BEM.getData('proker');
  renderProker();
}
async function deleteProker(id) {
  if (!confirm('Hapus proker ini?')) return;
  await BEM.deleteData('proker', id);
  proker = await BEM.getData('proker');
  renderProker();
}

loadAll();
window.addEventListener('hashchange', renderPage);
</script>
</body>
</html>
